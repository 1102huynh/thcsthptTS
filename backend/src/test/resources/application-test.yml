# Profile used by @ActiveProfiles("test") in @SpringBootTest classes.
# Same shape as application-dev.yml — points at local MySQL via env vars,
# with a localhost/3306/school_management convenience default.
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:school_management}?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

app:
  jwt:
    # Test-only signing key so the suite is self-contained (no real
    # JWT_SECRET env var needed to run `mvn test` locally or in CI). The
    # production profile still has no default and fails fast without one.
    secret: dGVzdC1vbmx5LWp3dC1zZWNyZXQtZm9yLXRoZS1zY2hvb2wtbWFuYWdlbWVudC1pbnRlZ3JhdGlvbi10ZXN0cw==
  admissions:
    rate-limit:
      # High enough that ordinary functional tests posting to /v1/admissions a
      # few times never trip it — AdmissionRateLimitFilter is a singleton bean
      # whose in-memory counters persist across test methods/classes sharing
      # this Spring context (they're not part of the @Transactional DB
      # rollback). The 429-triggering behavior itself is tested separately
      # with its own low override + @DirtiesContext, so it doesn't affect
      # every other test's shared state.
      max-requests: 1000
  auth:
    forgot-password-rate-limit:
      # Same reasoning as admissions.rate-limit.max-requests above.
      max-requests: 1000
    login-rate-limit:
      # Same reasoning as admissions.rate-limit.max-requests above — unlike
      # change-password-rate-limit (keyed by userId, naturally isolated per
      # test since each test creates its own user), this one is keyed by IP
      # like admissions/forgot-password, so every test hitting /v1/auth/login
      # shares the same counter across the whole shared Spring context.
      max-requests: 1000
  uploads:
    # Isolated from the real dev ./uploads dir (still covered by .gitignore's
    # /uploads/ pattern) so test runs never touch real uploaded files.
    dir: ./uploads/test
