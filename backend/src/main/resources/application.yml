spring:
  application:
    name: school-management-system

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

  # Email (sổ liên lạc điện tử, 3.6 EMAIL channel). Unlike JWT_SECRET this has
  # defaults and doesn't fail startup if unconfigured — an unreachable/absent
  # SMTP server just makes EmailNotificationSender.send() fail per-recipient
  # (caught, recorded as a failed delivery), not a security concern.
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:25}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: 8080
  servlet:
    context-path: /api

# JWT Configuration — secret has no default so the app fails fast at startup
# if it isn't set, instead of silently running with a weak/shared secret.
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:86400000}  # 24 hours in milliseconds
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}  # 7 days in milliseconds
  mail:
    from: ${MAIL_FROM:no-reply@school.local}
  admissions:
    rate-limit:
      max-requests: ${ADMISSION_RATE_LIMIT_MAX:5}
      window-minutes: ${ADMISSION_RATE_LIMIT_WINDOW_MINUTES:60}
      # Only set true if this instance sits behind a reverse proxy that sets/
      # overwrites X-Forwarded-For itself - otherwise a caller can forge that
      # header to dodge the limit. Default false rate-limits by the real TCP
      # peer address instead.
      trust-forwarded-for: ${ADMISSION_TRUST_FORWARDED_FOR:false}

# Swagger/API Documentation
springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    disable-swagger-default-url: true
  api-docs:
    path: /v3/api-docs
  show-actuator: false
