# Production profile — activate with SPRING_PROFILES_ACTIVE=prod.
# Every DB setting is required from the environment (no localhost/dev
# fallback), so a misconfigured deployment fails fast instead of
# silently pointing at the wrong database.
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=true&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=false&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    show-sql: false

logging:
  level:
    root: INFO
    com.schoolmanagement: INFO
    org.springframework.security: WARN
