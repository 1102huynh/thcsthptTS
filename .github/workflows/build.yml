name: Build & Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# One in-flight run per branch/PR; a new push cancels the previous.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------ backend
  build-backend:
    runs-on: ubuntu-latest

    # Integration tests are @SpringBootTest against a real MySQL + Flyway
    # (profile "test", see backend/src/test/resources/application-test.yml).
    # A service container gives them one; without it every @SpringBootTest
    # fails at context startup and `mvn test` was effectively a no-op.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: school_management
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: school_management
      DB_USERNAME: root
      DB_PASSWORD: root

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # The mysql service declares --health-cmd, so the job only starts these
      # steps once it reports healthy - no manual wait loop needed.
      - name: Build & test with Maven
        working-directory: ./backend
        run: mvn -B clean verify

      - name: Upload backend jar
        uses: actions/upload-artifact@v4
        with:
          name: school-management-backend-jar
          path: backend/target/*.jar
          retention-days: 5

  # ----------------------------------------------------------------- frontend
  build-frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint-ish build
        working-directory: ./frontend
        run: npm run build

      - name: Run tests (Vitest)
        working-directory: ./frontend
        run: npm test

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: school-management-frontend-build
          path: frontend/build/
          retention-days: 5

  # ------------------------------------------------------------- secret scan
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --------------------------------------------------------------- docker img
  docker-build:
    needs: [build-backend, build-frontend, secret-scan]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: school-management-backend-jar
          path: backend/target/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker images
        run: docker compose build

      - name: Done
        run: echo "Docker images built successfully (push to a registry is not wired up yet)"
